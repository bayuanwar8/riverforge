<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIVERFORGE — bend the river, power the forge</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a1418;
    min-height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  h1 {
    color: #f5c86e;
    letter-spacing: 0.35em;
    font-size: 18px;
    margin: 14px 0 8px;
    text-transform: uppercase;
  }
  canvas {
    display: block;
    background: #0e1f26;
    border: 2px solid #274b52;
    border-radius: 8px;
    max-width: 96vw;
    max-height: 88vh;
  }
  p.hint {
    color: #7fa3a8;
    font-size: 12px;
    margin: 8px 0 14px;
  }
</style>
</head>
<body>
<h1>Riverforge</h1>
<canvas id="game" width="1280" height="720"></canvas>
<p class="hint">1-5 channels &middot; R rotate &middot; G toggle gate &middot; Space pause &middot; Esc menu &middot; M mute</p>
<script type="module" src="./main.js"></script>
</body>
</html>
